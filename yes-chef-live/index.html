<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F2ED">
<title>Yes, Chef! — исследование поваров</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#F3F2ED}iframe{display:block;width:100%;height:100dvh;border:0;background:#F3F2ED}
</style>
</head>
<body>
<iframe id="survey" src="../yes-chef/" title="Yes, Chef! — исследование поваров"></iframe>
<script>
const NEW_ENDPOINT='https://script.google.com/macros/s/AKfycbziWAOxqe25FzQLAMdS-g3_LoTrvHaXDcjLb7vGA_IsCcXei_2h51SZxW2LZ01LELjpUA/exec';
const frame=document.getElementById('survey');
frame.addEventListener('load',()=>{
  try{
    const w=frame.contentWindow;
    const proto=w.HTMLFormElement.prototype;
    if(proto.__yesChefPatched)return;
    const nativeSubmit=proto.submit;
    proto.submit=function(){
      try{
        if(this.action && this.action.includes('script.google.com/macros/s/')){
          this.action=NEW_ENDPOINT;
        }
      }catch(e){}
      return nativeSubmit.call(this);
    };
    proto.__yesChefPatched=true;
  }catch(e){console.error(e)}
});
</script>
</body>
</html>
