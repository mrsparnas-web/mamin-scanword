<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><meta name="theme-color" content="#79c9f2"/><link rel="icon" href="data:,"/><title>Мамин сканворд</title><link rel="stylesheet" href="styles.css"/></head><body><main class="app"><header class="hero"><p class="eyebrow">☁ Сделано с любовью ☁</p><h1>Мамин сканворд</h1><p class="intro">Нажми на клетку и впиши ответ.</p><div class="progress-wrap" aria-label="Прогресс"><div class="progress-track"><span id="progressBar"></span></div><span id="progressText">0 из 16</span></div></header><section class="game-card"><div class="board-toolbar"><p>Двигай поле пальцем · нажми на вопрос или белую клетку</p><button id="resetButton" class="icon-button" type="button">Начать заново</button></div><div id="boardViewport" class="board-viewport"><div id="board" class="board" role="grid" aria-label="Сетка сканворда"></div></div></section><input id="nativeInput" class="native-input" type="text" inputmode="text" enterkeyhint="next" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" aria-label="Ввод буквы"/></main><div id="winModal" class="modal" hidden><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="winTitle"><div class="celebration">✦ ♥ ✦</div><p class="eyebrow">Все слова найдены</p><h2 id="winTitle">Мама, ты разгадала нашу вселенную!</h2><p>Пусть впереди будет ещё много дачных рассветов, попутного ветра и счастливых историй.</p><button id="closeModal" type="button">Посмотреть сканворд</button></div></div><script src="app.js"></script></body></html>
